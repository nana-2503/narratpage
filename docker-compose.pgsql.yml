# PostgreSQL 扩展：用 compose profile 启用
# 启动: docker compose --profile pgsql up --build -d
#
# 数据库类型在进程启动时读取，切换后需重建容器。
services:
  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: pgsql
      DB_DSN: ${DB_DSN:-postgres://${DB_USER:-narratpage}:${DB_PASSWORD:-narratpage}@db:5432/blog?sslmode=disable}

  db:
    image: postgres:16-alpine
    profiles: [pgsql]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-narratpage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-narratpage}
      POSTGRES_DB: ${DB_NAME:-blog}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-narratpage}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  pgsql-data:
